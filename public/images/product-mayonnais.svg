<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="jarGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FCFDFE"/>
      <stop offset="100%" stop-color="#ECEFF2"/>
    </linearGradient>
    <linearGradient id="lidBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D80E2"/>
      <stop offset="60%" stop-color="#1963B8"/>
      <stop offset="100%" stop-color="#0E488F"/>
    </linearGradient>
    <filter id="jarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="254" rx="60" ry="12" fill="#000000" opacity="0.08" />

  <!-- Mayo Jar -->
  <g filter="url(#jarShadow)">
    <!-- Blue Screw Lid -->
    <rect x="110" y="65" width="80" height="28" rx="6" fill="url(#lidBlueGrad)" stroke="#0E488F" stroke-width="1" />
    <line x1="118" y1="72" x2="118" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="126" y1="72" x2="126" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="134" y1="72" x2="134" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="142" y1="72" x2="142" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="150" y1="72" x2="150" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="158" y1="72" x2="158" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="166" y1="72" x2="166" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="174" y1="72" x2="174" y2="86" stroke="#5DA2F2" stroke-width="1.5" />
    <line x1="182" y1="72" x2="182" y2="86" stroke="#5DA2F2" stroke-width="1.5" />

    <!-- Jar Glass Body filled with Creamy Mayo -->
    <path d="M102 93 Q100 110 96 150 Q94 220 102 245 Q150 248 198 245 Q206 220 204 150 Q200 110 198 93 Z" fill="url(#jarGlassGrad)" stroke="#D4D9DE" stroke-width="1.5" />

    <!-- Label Banner (American Garden Mayonnaise Eggless) -->
    <path d="M96 140 Q150 146 204 140 L202 205 Q150 212 98 205 Z" fill="#F8F8FA" stroke="#D1D5DB" stroke-width="1" />
    <rect x="100" y="145" width="100" height="24" rx="2" fill="#E84824" />
    <text x="150" y="160" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AMERICAN GARDEN</text>
    
    <rect x="100" y="168" width="100" height="20" fill="#1C65B5" />
    <text x="150" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">MAYONNAISE</text>

    <!-- Eggless Badge -->
    <rect x="122" y="190" width="56" height="12" rx="3" fill="#69C23C" />
    <text x="150" y="199" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EGGLESS</text>
  </g>
</svg>
