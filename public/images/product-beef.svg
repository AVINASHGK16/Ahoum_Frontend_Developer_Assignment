<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="beefShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2D0A0A" flood-opacity="0.2" />
    </filter>
    <linearGradient id="beefMeatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C1C24" />
      <stop offset="50%" stop-color="#801018" />
      <stop offset="100%" stop-color="#5E080E" />
    </linearGradient>
    <linearGradient id="beefFatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="100%" stop-color="#D7CCC8" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="315" rx="135" ry="24" fill="#000000" opacity="0.12" />

  <g filter="url(#beefShadow)">
    <!-- Outer Fat Rim (Ribeye Cap) -->
    <path d="M85 200 C80 125 150 95 240 100 C310 105 325 160 315 225 C305 275 240 295 155 290 C95 285 88 245 85 200 Z" fill="url(#beefFatGrad)" />

    <!-- Main Beef Muscle / Ribeye Eye -->
    <path d="M98 200 C95 140 155 115 235 118 C295 120 305 165 298 220 C290 265 235 280 160 278 C108 275 100 240 98 200 Z" fill="url(#beefMeatGrad)" />

    <!-- Intramuscular Marbling Network -->
    <path d="M125 165 Q145 155 170 170 Q195 185 210 165" fill="none" stroke="url(#beefFatGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M140 215 Q170 200 195 220 Q225 240 255 210" fill="none" stroke="url(#beefFatGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <path d="M210 145 Q235 165 260 150" fill="none" stroke="url(#beefFatGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <path d="M165 245 Q190 235 215 255" fill="none" stroke="url(#beefFatGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M115 235 Q135 245 150 230" fill="none" stroke="url(#beefFatGrad)" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M245 185 Q265 195 280 180" fill="none" stroke="url(#beefFatGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Fine Marbling Flecks -->
    <circle cx="150" cy="180" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="185" cy="155" r="2" fill="#FFFFFF" opacity="0.75" />
    <circle cx="230" cy="190" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="175" cy="225" r="2" fill="#FFFFFF" opacity="0.75" />
    <circle cx="260" cy="230" r="2.2" fill="#FFFFFF" opacity="0.8" />

    <!-- T-Bone / Bone Inlay -->
    <ellipse cx="96" cy="155" rx="14" ry="18" fill="url(#boneGrad)" stroke="#BCAAA4" stroke-width="1.5" />
    <ellipse cx="96" cy="155" rx="8" ry="10" fill="#8D6E63" opacity="0.5" />

    <!-- Rosemary Sprig Garnish -->
    <path d="M230 260 Q270 215 315 200" fill="none" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round" />
    <!-- Rosemary Leaves -->
    <path d="M250 245 L242 230 M265 233 L260 218 M280 222 L278 206 M295 212 L300 196 M310 204 L318 190" stroke="#388E3C" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
